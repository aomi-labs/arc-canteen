databases:
  - name: arc-canteen-payment
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: arc-canteen-payment-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./services/payment-api/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: off
    disk:
      name: circle-cli-home
      mountPath: /var/circle
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arc-canteen-payment
          property: connectionString
      - key: PAYMENT_API_BEARER_TOKEN
        generateValue: true
      - key: CIRCLE_WALLET_ADDRESS
        sync: false
      - key: APPROVED_INVOICES_JSON
        sync: false
      - key: CIRCLE_CLI_HOME
        value: /var/circle
      - key: HOST
        value: 0.0.0.0
      - key: ARC_CHAIN
        value: ARC-TESTNET
      - key: ARC_TESTNET_USDC
        value: "0x3600000000000000000000000000000000000000"
      - key: MAX_AMOUNT_USDC_MICROS
        value: "10000000"
      - key: ARCSCAN_BASE_URL
        value: https://testnet.arcscan.app
      - key: CIRCLE_VERSION_CHECK
        value: off
