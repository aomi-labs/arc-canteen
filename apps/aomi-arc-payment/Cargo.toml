[package]
name = "aomi-arc-payment"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Hosted Aomi App that pays approved Arc Canteen invoices through the operator payment API"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aomi-sdk = "=5.1.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
